<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Práctica Daniela</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      padding: 2rem;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: #e2e8f0;
      background: radial-gradient(circle at 20% 20%, #1e3a8a 0%, transparent 45%),
                  radial-gradient(circle at 80% 80%, #6d28d9 0%, transparent 45%),
                  #0b1120;
    }
    header { text-align: center; }
    .tag {
      display: inline-block;
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #93c5fd;
      border: 1px solid #334155;
      border-radius: 999px;
      padding: 0.35rem 1rem;
      margin-bottom: 1rem;
    }
    h1 { font-size: clamp(2rem, 5vw, 3.2rem); font-weight: 800; }
    h1 span {
      background: linear-gradient(90deg, #38bdf8, #a78bfa);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    header p { margin-top: 0.75rem; color: #94a3b8; }
    .servers { display: flex; gap: 2rem; flex-wrap: wrap; justify-content: center; }
    .card {
      width: 260px;
      padding: 2rem;
      border-radius: 20px;
      text-align: center;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid #1e293b;
      opacity: 0.4;
      transform: scale(0.95);
      transition: all 0.3s ease;
    }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
    .card h2 { font-size: 1.8rem; margin-bottom: 0.75rem; }
    .status { font-size: 0.95rem; color: #64748b; }
    .on { display: none; color: #4ade80; font-weight: 600; }
    .dot {
      display: inline-block;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #4ade80;
      margin-right: 6px;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7); }
      100% { box-shadow: 0 0 0 12px rgba(74, 222, 128, 0); }
    }
    body.s1 .c1, body.s2 .c2 {
      opacity: 1;
      transform: scale(1.05);
      border-color: #38bdf8;
      box-shadow: 0 0 40px rgba(56, 189, 248, 0.35);
    }
    body.s1 .c1 .on, body.s2 .c2 .on { display: inline; }
    body.s1 .c1 .off, body.s2 .c2 .off { display: none; }
    footer { font-size: 0.85rem; color: #64748b; }
  </style>
</head>
<body class="ACTIVO">
  <header>
    <div class="tag">nginx · least_conn</div>
    <h1>Práctica <span>Load Balancer</span></h1>
    <p>El servidor iluminado es el que atendió tu visita</p>
  </header>

  <section class="servers">
    <div class="card c1">
      <div class="icon">🖥️</div>
      <h2>Server 1</h2>
      <p class="status"><span class="on"><span class="dot"></span>Atendiendo</span><span class="off">En espera</span></p>
    </div>
    <div class="card c2">
      <div class="icon">🖥️</div>
      <h2>Server 2</h2>
      <p class="status"><span class="on"><span class="dot"></span>Atendiendo</span><span class="off">En espera</span></p>
    </div>
  </section>

  <footer>Rocky Linux · SSH Hardening · 2026</footer>
</body>
</html>
